name: Studio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio-test
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          DATABASE_URL: postgres://studio:studio-test@localhost:5432/studio_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
